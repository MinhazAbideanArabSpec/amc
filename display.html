<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ArabSpec AMC Portal — Office Display</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      /* Matches the "Warning" color used app-wide (Asset Health tiles, visit results) */
      --disp-yellow-bg:     #FEF9E7;
      --disp-yellow-border: #D4A017;
      --disp-yellow-text:   #D4A017;
      /* Matches the app's canonical expired/critical color (--rust) */
      --disp-red-bg:        var(--rust-bg);
      --disp-red-border:    var(--rust);
      --disp-red-text:      var(--rust);
    }
    body { overflow: hidden; }
    #display-login { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--paper); }
    #display-screen { display: none; min-height: 100vh; background: var(--paper); color: var(--ink); padding: 40px 56px; }

    .disp-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 30px; padding-bottom: 22px; border-bottom: 1px solid var(--line);
    }
    .disp-title { font-size: 32px; color: var(--ink); }
    .disp-subtitle { font-size: 13px; color: var(--ink-soft); margin-top: 6px; letter-spacing: 0.02em; }
    .disp-clock { text-align: right; }
    .disp-clock .time { font-size: 30px; font-weight: 700; color: var(--ink); font-family: 'Source Serif 4', serif; line-height: 1; }
    .disp-clock .date { font-size: 14px; color: var(--ink-soft); margin-top: 6px; }

    .disp-grid { display: flex; flex-direction: column; gap: 14px; }
    .disp-row {
      display: grid; grid-template-columns: 130px 1fr 170px 240px; align-items: center; gap: 24px;
      background: var(--card); border-radius: 10px; padding: 20px 26px;
      border: 1px solid var(--line); border-left: 6px solid var(--line);
      box-shadow: 0 1px 3px rgba(28,38,34,0.05);
    }
    .disp-row.expiring { border-left-color: var(--disp-yellow-border); background: var(--disp-yellow-bg); }
    .disp-row.expired  { border-left-color: var(--disp-red-border);    background: var(--disp-red-bg); }
    .disp-row.visit    { border-left-color: var(--accent); background: #EEF3F8; }
    .disp-row.reported { border-left-color: var(--sage); background: var(--sage-bg); }

    .disp-type-badge {
      font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
      padding: 8px 10px; border-radius: 6px; text-align: center;
    }
    .disp-type-badge.contract { background: var(--slate-bg); color: var(--accent-dark); }
    .disp-type-badge.renewal  { background: #EEEDFE; color: #4C3FA0; }
    .disp-type-badge.visit    { background: var(--slate-bg); color: var(--accent-dark); }

    .disp-customer { font-size: 21px; font-weight: 700; color: var(--ink); }
    .disp-item { font-size: 15px; color: var(--ink-soft); margin-top: 3px; }
    .disp-date { font-size: 15px; color: var(--ink-soft); text-align: right; }
    .disp-days {
      font-size: 26px; font-weight: 800; text-align: right; color: var(--ink-soft);
      white-space: nowrap; text-transform: uppercase; letter-spacing: 0.01em;
    }
    .disp-days.expiring-text { color: var(--disp-yellow-text); }
    .disp-days.expired-text  { color: var(--disp-red-text); }
    .disp-days.visit-text    { color: var(--accent); }
    .disp-days.reported-text { color: var(--sage); }

    .disp-pagedots { display: flex; gap: 8px; justify-content: center; margin-top: 30px; }
    .disp-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); transition: all 0.2s; }
    .disp-dot.active { background: var(--accent); width: 24px; border-radius: 5px; }

    .disp-empty { text-align: center; padding: 100px 0; font-size: 22px; color: var(--ink-soft); }

    @media (max-width: 900px) {
      .disp-row { grid-template-columns: 100px 1fr; grid-template-rows: auto auto; }
      .disp-date, .disp-days { text-align: left; grid-column: 2; }
    }
  </style>
</head>
<body>

  <!-- Login gate -->
  <div id="display-login">
    <div class="login-box" style="max-width:360px;">
      <h1>ArabSpec AMC Portal</h1>
      <div class="login-sub">Office Display — Admin Sign-In</div>

      <div id="dlogin-step-email">
        <div id="dlogin-error"></div>
        <label>Email</label>
        <input type="email" id="dlogin-email" placeholder="admin@arabspec.com" autocomplete="email"/>
        <button onclick="dSendOtp()" id="dbtn-send-otp" style="width:100%;">Send Sign-In Code</button>
      </div>

      <div id="dlogin-step-otp" style="display:none;">
        <div id="dlogin-otp-msg" style="font-size:13px;color:#94A3B8;margin-bottom:16px;"></div>
        <div id="dlogin-otp-error"></div>
        <label>Sign-In Code</label>
        <input type="text" id="dlogin-otp" placeholder="••••••••" maxlength="8" autocomplete="one-time-code"
          style="text-align:center;font-size:20px;font-weight:600;letter-spacing:0.2em;"/>
        <button onclick="dVerifyOtp()" id="dbtn-verify-otp" style="width:100%;">Sign In</button>
      </div>
    </div>
  </div>

  <!-- Display screen -->
  <div id="display-screen">
    <div class="disp-header">
      <div>
        <div class="disp-title" id="disp-title">Expiring &amp; Expired Renewals</div>
        <div class="disp-subtitle" id="disp-subtitle">ArabSpec AMC Portal — Office Display · updates automatically</div>
      </div>
      <div class="disp-clock">
        <div class="time" id="disp-time">--:--</div>
        <div class="date" id="disp-date">—</div>
      </div>
    </div>

    <div class="disp-grid" id="disp-grid">
      <div class="disp-empty">Loading…</div>
    </div>

    <div class="disp-pagedots" id="disp-pagedots"></div>
  </div>

  <script src="display.js"></script>
</body>
</html>
