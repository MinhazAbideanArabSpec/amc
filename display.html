<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ArabSpec AMC Portal — Office Display</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body { overflow: hidden; }
    #display-login { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--paper); }
    #display-screen { display: none; min-height: 100vh; background: var(--ink); color: #fff; padding: 40px 56px; }

    .disp-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 32px; }
    .disp-title { font-size: 32px; color: #fff; }
    .disp-subtitle { font-size: 13px; color: #9CA3AF; margin-top: 6px; letter-spacing: 0.03em; }
    .disp-clock { text-align: right; }
    .disp-clock .time { font-size: 30px; font-weight: 700; color: #fff; font-family: 'Source Serif 4', serif; line-height: 1; }
    .disp-clock .date { font-size: 14px; color: #9CA3AF; margin-top: 6px; }

    .disp-grid { display: flex; flex-direction: column; gap: 14px; }
    .disp-row {
      display: grid; grid-template-columns: 120px 1fr 260px 200px; align-items: center; gap: 24px;
      background: rgba(255,255,255,0.045); border-radius: 10px; padding: 20px 26px;
      border-left: 5px solid rgba(255,255,255,0.15);
    }
    .disp-row.soon   { border-left-color: var(--amber); background: rgba(146,102,15,0.12); }
    .disp-row.urgent { border-left-color: var(--rust);  background: rgba(192,57,43,0.14); }

    .disp-type-badge {
      font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
      padding: 7px 10px; border-radius: 6px; text-align: center;
    }
    .disp-type-badge.contract { background: rgba(59,87,115,0.35); color: #9DC0E8; }
    .disp-type-badge.renewal  { background: rgba(91,33,182,0.30); color: #C7B4F5; }

    .disp-customer { font-size: 21px; font-weight: 700; color: #fff; }
    .disp-item { font-size: 15px; color: #C9D4DE; margin-top: 3px; }
    .disp-date { font-size: 15px; color: #9CA3AF; text-align: right; }
    .disp-days { font-size: 30px; font-weight: 800; text-align: right; color: #9CA3AF; }
    .disp-days.soon-text   { color: #FBBF24; }
    .disp-days.urgent-text { color: #F87171; }

    .disp-pagedots { display: flex; gap: 8px; justify-content: center; margin-top: 30px; }
    .disp-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.2); transition: all 0.2s; }
    .disp-dot.active { background: var(--accent); width: 24px; border-radius: 5px; }

    .disp-empty { text-align: center; padding: 100px 0; font-size: 22px; color: #9CA3AF; }

    @media (max-width: 900px) {
      .disp-row { grid-template-columns: 90px 1fr; grid-template-rows: auto auto; }
      .disp-date, .disp-days { text-align: left; grid-column: 2; }
    }
  </style>
</head>
<body>

  <!-- Login gate -->
  <div id="display-login">
    <div class="login-box" style="max-width:360px;">
      <h1>ArabSpec AMC Portal</h1>
      <div class="login-sub">Office Display — Admin Sign-In</div>

      <div id="dlogin-step-email">
        <div id="dlogin-error"></div>
        <label>Email</label>
        <input type="email" id="dlogin-email" placeholder="admin@arabspec.com" autocomplete="email"/>
        <button onclick="dSendOtp()" id="dbtn-send-otp" style="width:100%;">Send Sign-In Code</button>
      </div>

      <div id="dlogin-step-otp" style="display:none;">
        <div id="dlogin-otp-msg" style="font-size:13px;color:#94A3B8;margin-bottom:16px;"></div>
        <div id="dlogin-otp-error"></div>
        <label>Sign-In Code</label>
        <input type="text" id="dlogin-otp" placeholder="••••••••" maxlength="8" autocomplete="one-time-code"
          style="text-align:center;font-size:20px;font-weight:600;letter-spacing:0.2em;"/>
        <button onclick="dVerifyOtp()" id="dbtn-verify-otp" style="width:100%;">Sign In</button>
      </div>
    </div>
  </div>

  <!-- Display screen -->
  <div id="display-screen">
    <div class="disp-header">
      <div>
        <div class="disp-title">Expiring &amp; Expired Renewals</div>
        <div class="disp-subtitle">ArabSpec AMC Portal — Office Display · updates automatically</div>
      </div>
      <div class="disp-clock">
        <div class="time" id="disp-time">--:--</div>
        <div class="date" id="disp-date">—</div>
      </div>
    </div>

    <div class="disp-grid" id="disp-grid">
      <div class="disp-empty">Loading…</div>
    </div>

    <div class="disp-pagedots" id="disp-pagedots"></div>
  </div>

  <script src="display.js"></script>
</body>
</html>
